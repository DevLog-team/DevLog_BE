                    }"
  /api/tasks/priority:
    get:
      tags:
      - Task
      summary: 작업 우선순위 목록 조회  API
      description: 작업 우선순위 목록 조회  API
      operationId: 작업 우선순위 목록 조회 성공
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPriorityListResponse"
              examples:
                작업 우선순위 목록 조회 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":{\"taskPriorities\":[\"\
                    LOW\",\"MEDIUM\",\"HIGH\",\"URGENT\"]},\"timestamp\":\"2026-06-04T18:02:40.0296123\"\
                    }"
  /api/tasks/status:
    get:
      tags:
      - Task
      summary: 작업 상태 목록 조회  API
      description: 작업 상태 목록 조회  API
      operationId: 작업 상태 목록 조회 성공
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusListResponse"
              examples:
                작업 상태 목록 조회 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":{\"taskStatusList\":[\"\
                    TODO\",\"IN_PROGRESS\",\"DONE\",\"HOLD\"]},\"timestamp\":\"2026-06-04T18:02:40.0632693\"\
                    }"
  /api/projects/{projectId}/invite:
    post:
      tags:
