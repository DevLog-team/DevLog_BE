        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanBoardResponse"
              examples:
                칸반보드 작업 목록 조회 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":{\"board\":{\"TODO\":[{\"\
