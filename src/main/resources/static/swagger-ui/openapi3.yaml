openapi: 3.0.1
info:
  title: DevLog API
  description: DevLog API Documentation
  version: 0.1.0
servers:
- url: http://localhost:8080
tags: []
paths:
  /api/login:
    post:
      tags:
      - Auth
      summary: 로그인 API
      description: 로그인 API
      operationId: 로그인 성공
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              로그인 성공:
                value: "{\"email\":\"test@naver.com\",\"password\":\"testpw1234\"}"
      responses:
        "200":
          description: "200"
          headers:
            Authorization:
              description: 엑세스 토큰을 Header Authorization에 담아서 응답
              schema:
                type: string
            Set-Cookie:
              description: 리프레시 토큰을 HttpOnly 쿠키에 담아서 응답
              schema:
                type: string
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                로그인 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":{\"userId\":1,\"email\"\
                    :\"test@naver.com\",\"name\":\"test\"},\"timestamp\":\"2026-06-04T18:01:57.7766518\"\
                    }"
  /api/logout:
    post:
      tags:
      - Auth
      summary: 로그아웃 API
      description: 로그아웃 API
      operationId: 로그아웃 성공
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/api-logout229656191"
              examples:
                로그아웃 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":null,\"timestamp\":\"2026-06-04T18:01:58.0324529\"\
                    }"
  /api/project:
    post:
      tags:
      - Project
      summary: 프로젝트 생성 API
      description: 프로젝트 생성 API
      operationId: 프로젝트 생성 성공
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            examples:
              프로젝트 생성 성공:
                value: "{\"title\":\"스프링부트 프로젝트\",\"description\":\"개발 프로젝트 설명입니다\
                  .\",\"status\":\"ACTIVE\",\"startDate\":\"2026-06-04\",\"endDate\"\
                  :\"2026-09-04\"}"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectResponse"
              examples:
                프로젝트 생성 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":{\"projectId\":1},\"timestamp\"\
                    :\"2026-06-04T18:01:59.5180644\"}"
  /api/projects:
    get:
      tags:
      - Project
      summary: 프로젝트 목록 조회 API(페이징 및 동적 검색을 지원)
      description: 프로젝트 목록 조회 API(페이징 및 동적 검색을 지원)
      operationId: 프로젝트 목록 조회 성공
      parameters:
      - name: title
        in: query
        description: 프로젝트 제목 검색 키워드 (부분 일치)
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: "프로젝트 상태 필터링(ALL, ACTIVE, COMPLETED, ARCHIVED)"
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: "페이지 번호 (0부터 시작, 기본값: 0)"
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "한 페이지 당 조회 개수 (기본값: 10)"
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: "정렬 기준 및 방향 (기본값: createdAt,desc)"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
              examples:
                프로젝트 목록 조회 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":{\"content\":[{\"projectId\"\
                    :1,\"title\":\"스프링부트 프로젝트\",\"description\":\"개발 프로젝트 설명입니다.\"\
                    ,\"status\":\"ACTIVE\",\"endDate\":\"2026-09-04\",\"role\":\"\
                    OWNER\",\"totalTaskCount\":10,\"completedTaskCount\":6,\"inProgressTaskCount\"\
                    :4,\"progressRate\":0.6}],\"pageInfo\":{\"currentPage\":1,\"pageSize\"\
                    :10,\"totalElements\":1,\"totalPages\":1,\"isFirst\":true,\"isLast\"\
                    :true}},\"timestamp\":\"2026-06-04T18:01:59.4675246\"}"
  /api/reissue:
    post:
      tags:
      - Auth
      summary: 리프레시 토큰 재발급 API
      description: 리프레시 토큰 재발급 API
      operationId: '토큰 재발급 '
      responses:
        "200":
          description: "200"
          headers:
            Authorization:
              description: 엑세스 토큰을 Header Authorization에 담아서 응답
              schema:
                type: string
            Set-Cookie:
              description: 리프레시 토큰을 HttpOnly 쿠키에 담아서 응답
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-logout229656191"
              examples:
                토큰 재발급 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":null,\"timestamp\":\"2026-06-04T18:01:56.7980667\"\
                    }"
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-reissue2116916718"
              examples:
                토큰 재발급 실패 - 리프레시 토큰이 만료 되었을 경우:
                  value: "{\"status\":\"ERROR\",\"body\":{\"status\":\"UNAUTHORIZED\"\
                    ,\"message\":\"Refresh Token이 만료되었습니다.\"},\"timestamp\":\"2026-06-04T18:01:57.4750801\"\
                    }"
  /api/signup:
    post:
      tags:
      - User
      summary: 회원가입 API
      description: 회원가입 API
      operationId: user/signup
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/SignupRequest"
            examples:
              user/signup:
                value: "{\"email\":\"test@naver.com\",\"password\":\"testpw1234\"\
                  ,\"name\":\"test\"}"
      responses:
        "201":
          description: "201"
          headers:
            Location:
              description: 리소스 위치
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
              examples:
                user/signup:
                  value: "{\"status\":\"SUCCESS\",\"body\":{\"userId\":1},\"timestamp\"\
                    :\"2026-06-04T18:03:11.2941067\"}"
  /api/tag:
    post:
      tags:
      - Tag
      summary: 태그 생성 API
      description: 태그 생성 API
      operationId: 태그 생성 성공
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
            examples:
              태그 생성 성공:
                value: "{\"name\":\"백엔드\",\"color\":\"blue\"}"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTagResponse"
              examples:
                태그 생성 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":{\"tagId\":1},\"timestamp\"\
                    :\"2026-06-04T18:02:39.4054031\"}"
  /api/tags:
    get:
      tags:
      - Tag
      summary: 태그 목록 조회 API
      description: 태그 목록 조회 API
      operationId: 태그 목록 조회 성공
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
              examples:
                태그 목록 조회 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":{\"tags\":[{\"tagId\":1,\"\
                    name\":\"백엔드\",\"color\":\"blue\"}]},\"timestamp\":\"2026-06-04T18:02:39.3190832\"\
                    }"
  /api/task:
    post:
      tags:
      - Task
      summary: 작업(Task) 생성 API
      description: 작업(Task) 생성 API
      operationId: 작업 생성 성공
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
            examples:
              작업 생성 성공:
                value: "{\"projectId\":1,\"title\":\"인증 기능 구현\",\"description\":\"\
                  스프링 시큐리티 + JWT 기반 로그인 API 개발\",\"status\":\"TODO\",\"priority\"\
                  :\"HIGH\",\"dueDate\":\"2026-06-11\",\"tagIds\":[1],\"assigneeId\"\
                  :1}"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskIdResponse"
              examples:
                작업 생성 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":{\"taskId\":1},\"timestamp\"\
                    :\"2026-06-04T18:02:40.1068119\"}"
  /api/tasks:
    get:
      tags:
      - Task
      summary: 검색 조건 및 페이지네이션을 포함한 작업 목록 조회 API
      description: 검색 조건 및 페이지네이션을 포함한 작업 목록 조회 API
      operationId: 작업 목록 조회 성공
      parameters:
      - name: projectId
        in: query
        description: 조회할 프로젝트 고유 식별 ID
        required: true
        schema:
          type: string
      - name: title
        in: query
        description: 검색할 작업 제목 키워드
        required: false
        schema:
          type: string
      - name: assigneeId
        in: query
        description: 담당자 고유 ID (전체 조회시 0 또는 NULL)
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: "작업 상태 필터 (ALL, TODO, IN_PROGRESS, DONE, HOLD)"
        required: false
        schema:
          type: string
      - name: priority
        in: query
        description: "우선순위 필터 (ALL, LOW, MEDIUM, HIGH, URGENT)"
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: "조회할 페이지 번호 (0부터 시작, 기본값: 0)"
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "한 페이지당 보여줄 데이터 개수 (기본값: 10)"
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: "정렬 기준 필드 및 방향 (기본값: dueDate,asc)"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
              examples:
                작업 목록 조회 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":{\"content\":[{\"taskId\"\
                    :1,\"title\":\"인증 기능 구현\",\"assigneeName\":\"개발자A\",\"status\"\
                    :\"TODO\",\"priority\":\"HIGH\",\"dueDate\":\"2026-06-11\"}],\"\
                    pageInfo\":{\"currentPage\":1,\"pageSize\":10,\"totalElements\"\
                    :1,\"totalPages\":1,\"isFirst\":true,\"isLast\":true}},\"timestamp\"\
                    :\"2026-06-04T18:02:39.9377095\"}"
  /api/projects/{projectId}:
    get:
      tags:
      - Project
      summary: 프로젝트 단건 조회 API
      description: 프로젝트 단건 조회 API
      operationId: 프로젝트 단건 조회 성공
      parameters:
      - name: projectId
        in: path
        description: 조회할 프로젝트의 고유 식별 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
              examples:
                프로젝트 단건 조회 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":{\"projectId\":1,\"title\"\
                    :\"스프링부트 프로젝트\",\"description\":\"개발 프로젝트 설명입니다.\",\"status\"\
                    :\"ACTIVE\",\"startDate\":\"2026-06-04\",\"endDate\":\"2026-09-04\"\
                    ,\"role\":\"OWNER\",\"memberCount\":2,\"totalTaskCount\":10,\"\
                    completedTaskCount\":6,\"inProgressTaskCount\":4,\"delayedTaskCount\"\
                    :2},\"timestamp\":\"2026-06-04T18:01:59.4135764\"}"
    put:
      tags:
      - Project
      summary: 프로젝트 전체 정보 수정 API (OWNER 권한 필수)
      description: 프로젝트 전체 정보 수정 API (OWNER 권한 필수)
      operationId: 프로젝트 수정 성공
      parameters:
      - name: projectId
        in: path
        description: 수정할 프로젝트의 고유 식별 ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
            examples:
              프로젝트 수정 성공:
                value: "{\"title\":\"수정된 프로젝트 제목\",\"description\":\"수정된 상세 설명입니다\
                  .\",\"status\":\"COMPLETED\",\"startDate\":\"2026-06-05\",\"endDate\"\
                  :\"2026-07-04\"}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateProjectResponse"
              examples:
                프로젝트 수정 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":{\"projectId\":1},\"timestamp\"\
                    :\"2026-06-04T18:01:59.3726593\"}"
    delete:
      tags:
      - Project
      summary: "프로젝트 삭제 API (OWNER 권한 필수, 논리 삭제로 처리)"
      description: "프로젝트 삭제 API (OWNER 권한 필수, 논리 삭제로 처리)"
      operationId: 프로젝트 삭제 성공
      parameters:
      - name: projectId
        in: path
        description: 삭제할 프로젝트의 고유 식별 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-tags-tagId486549215"
              examples:
                프로젝트 삭제 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":null,\"timestamp\":\"2026-06-04T18:01:59.3302692\"\
                    }"
  /api/tags/{tagId}:
    get:
      tags:
      - Tag
      summary: 태그 단건 조회 API
