      description: 태그 수정 API
      operationId: 태그 수정 성공
      parameters:
      - name: tagId
        in: path
        description: ""
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/UpdateTagRequest"
            examples:
              태그 수정 성공:
                value: "{\"name\":\"수정된 이름\",\"color\":\"수정된 색\"}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
              examples:
                태그 수정 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":{\"tagId\":1},\"timestamp\"\
                    :\"2026-06-04T18:02:39.281147\"}"
    delete:
      tags:
      - Tag
      summary: 태그 삭제 API
      description: 태그 삭제 API
      operationId: 태그 삭제 성공
      parameters:
      - name: tagId
        in: path
        description: 삭제할 태그의 고유 식별 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-tags-tagId486549215"
              examples:
                태그 삭제 성공:
                  value: "{\"status\":\"SUCCESS\",\"body\":null,\"timestamp\":\"2026-06-04T18:02:39.2417182\"\
                    }"
  /api/tasks/kanban:
    get:
      tags:
      - Task
      summary: 프로젝트별 칸반보드 작업 목록 조회 API
